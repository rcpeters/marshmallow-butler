services:
  robot-controller:
    image: so101-ventuno-q-robot-controller:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: so101-robot-controller
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - ./data:/app/data
    # Uncomment verified host devices after Phases 2 & 3:
    # devices:
    #   - /dev/so101_follower:/dev/so101_follower
    #   - /dev/video0:/dev/video0
    #   - /dev/video2:/dev/video2
    networks:
      - ventuno-net
    restart: unless-stopped

  # Interactive bring-up & calibration container (ignored by `docker compose up`)
  robot-tools:
    image: so101-ventuno-q-robot-controller:latest
    profiles: ["tools"]
    privileged: true
    env_file:
      - .env
    volumes:
      - /dev:/dev
      - ./config:/app/config
      - ./assets:/app/assets
      - ./data:/app/data
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # Local AI Voice Assistant Services (Seed once via Arduino App Lab!)
  # Run App Lab's "Local AI Voice Assistant" once on the VENTUNO Q, then copy
  # the generated ghcr.io/arduino/app-bricks/ service blocks (including
  # /dev/fastrpc-* devices, /usr/lib/dsp, /lib/firmware, and ADSP_LIBRARY_PATH)
  # from App Lab's generated .cache/app-compose.yaml below.
  # ---------------------------------------------------------------------------
  # keyword-spotting: ...
  # whisper-asr: ...
  # gemma-llm: ...
  # local-tts: ...

networks:
  ventuno-net:
    driver: bridge
