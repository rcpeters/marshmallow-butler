services:
  robot-controller:
    image: so101-ventuno-q-robot-controller:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: so101-robot-controller
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - ./data:/app/data
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tests:/app/tests
    devices:
      - /dev/snd:/dev/snd
      # Adjust/uncomment arm & camera nodes as needed for autonomous robot-controller:
      - ${SO101_FOLLOWER_PORT:-/dev/ttyACM0}:${SO101_FOLLOWER_PORT:-/dev/ttyACM0}
      - ${CAM_OVERHEAD_DEVICE:-/dev/video0}:${CAM_OVERHEAD_DEVICE:-/dev/video0}
      - ${CAM_WRIST_DEVICE:-/dev/video2}:${CAM_WRIST_DEVICE:-/dev/video2}
    group_add:
      - "20"  # dialout
      - "29"  # audio
      - "44"  # video
    depends_on:
      llamacpp-models-runner:
        condition: service_healthy
      audio-analytics-runner:
        condition: service_healthy
      kokoro-tts:
        condition: service_healthy
    networks:
      - ventuno-net
    restart: unless-stopped

  llamacpp-models-runner:
    image: ghcr.io/arduino/app-bricks/llamacpp-npu-runner:0.13.2
    container_name: ventuno-gemma-llm
    devices:
      - /dev/dma_heap/system:/dev/dma_heap/system:rwm
      - /dev/fastrpc-cdsp:/dev/fastrpc-cdsp:rwm
    volumes:
      - /var/lib/arduino-app-cli/models/llamacpp:/models
      - /sys/firmware/devicetree/base/model:/run/device-model
      - /usr/share/qcom:/run/host-qcom:ro
    environment:
      BOARD_NAME: ventunoq
      HOST_DSP_INSTALLATION_PATH: /usr/share/qcom
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "9999"
      LLAMA_ARG_MODELS_DIR: /models
      LLAMA_ARG_MODELS_MAX: "2"
      LLAMA_ARG_CTX_SIZE: "16384"
      LLAMA_ARG_REASONING: "off"
      LLAMA_ARG_THINK_BUDGET: "128"
      LLAMA_ARG_FLASH_ATTN: "on"
      LLAMA_ARG_FIT: "off"
      LLAMA_ARG_BATCH: "1024"
      LLAMA_ARG_UBATCH: "512"
      LLAMA_ARG_THREADS: "4"
      LLAMA_ARG_CPU_MASK: 0x0f
      LLAMA_ARG_POLL: "0"
      GGML_HEXAGON_DEVICES: "1"
      GGML_HEXAGON_MBUF: 256,256
      GGML_HEXAGON_OPBATCH: "2048"
      LLAMA_LOG_LEVEL: error
      MODELS_PATH: /var/lib/arduino-app-cli/models
      XDG_CACHE_HOME: /models
      ADSP_LIBRARY_PATH: /opt/pkg-snapdragon/lib
      CDSP_LIBRARY_PATH: /usr/lib/rfsa/adsp
      LD_LIBRARY_PATH: /opt/pkg-snapdragon/lib
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9999/v1/models', timeout=2)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - ventuno-net
    restart: unless-stopped

  audio-analytics-runner:
    image: artifacts.codelinaro.org/iot-solutions-microservices/audio-analytics:1.0.5
    container_name: ventuno-whisper-asr
    user: "0:0"
    devices:
      - /dev/dma_heap/system:/dev/dma_heap/system:rwm
      - /dev/fastrpc-cdsp:/dev/fastrpc-cdsp:rwm
      - /dev/fastrpc-adsp-secure:/dev/fastrpc-adsp-secure:rwm
    group_add:
      - "44"
      - "29"
      - "993"
      - "20"
      - "127"
      - "125"
      - "989"
      - "985"
    volumes:
      - /var/lib/arduino-app-cli/models/audio-analytics:/mnt/work/models:ro
      - /sys/firmware/devicetree/base/model:/run/device-model
      - /usr/share/qcom:/run/host-qcom
    tmpfs:
      - /app/uploads:rw,size=500m,mode=777
      - /tmp/audio-cache:rw,size=2g,mode=777
    environment:
      ASR_MODELS_DIR: /mnt/work/models/asr
      MODELS_DIR: /mnt/work/models
      MODELS_PATH: /var/lib/arduino-app-cli/models
      BOARD_NAME: ventunoq
      HOST_DSP_INSTALLATION_PATH: /usr/share/qcom
      DEV_MODE: "false"
      LOG_LEVEL: "20"
      SESSION_TIMEOUT_S: "30"
      TRANSLATION_MODELS_DIR: /mnt/work/models/translation
      TTS_MODELS_DIR: /mnt/work/models/tts
      VAD_LEN_HANGOVER: "70"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/audio-analytics/v1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ventuno-net
    restart: unless-stopped

  kokoro-tts:
    image: keyword-asr-local-llm-kokoro-tts-kokoro_tts:latest
    container_name: ventuno-kokoro-tts
    user: "1000:1000"
    group_add:
      - "44"
      - "29"
      - "993"
      - "20"
      - "127"
      - "125"
      - "989"
      - "985"
    environment:
      KOKORO_MODEL: fp16
      KOKORO_PORT: "9100"
      KOKORO_THREADS: "4"
      KOKORO_VOICE: ${TTS_VOICE:-bm_george}
      BOARD_NAME: ventunoq
      HOST_DSP_INSTALLATION_PATH: /usr/share/qcom
      MODELS_PATH: /var/lib/arduino-app-cli/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9100/health',timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    networks:
      - ventuno-net
    restart: unless-stopped

  ei-keyword-spot-runner:
    image: ghcr.io/arduino/app-bricks/ei-qnn-models-runner:0.13.2
    container_name: ventuno-kws
    profiles: ["wakeword"]
    command:
      - --model-file
      - /models/ootb/ei/keyword-spotting-hey-arduino.eim
      - --run-http-server
      - "1337"
      - --dont-print-predictions
    user: "1000:1000"
    devices:
      - /dev/dma_heap/system:/dev/dma_heap/system:rwm
      - /dev/fastrpc-cdsp:/dev/fastrpc-cdsp:rwm
    group_add:
      - "44"
      - "29"
      - "993"
      - "20"
      - "127"
      - "125"
      - "989"
      - "985"
    volumes:
      - /home/arduino/.arduino-bricks/ei-models:/home/arduino/.arduino-bricks/ei-models
      - /var/lib/arduino-app-cli/models/edge-impulse:/var/lib/arduino-app-cli/models/edge-impulse
      - /sys/firmware/devicetree/base/model:/run/device-model
      - /usr/share/qcom:/usr/share/qcom
    environment:
      BOARD_NAME: ventunoq
      HOST_DSP_INSTALLATION_PATH: /usr/share/qcom
      MODELS_PATH: /var/lib/arduino-app-cli/models
      CUSTOM_MODEL_PATH: /home/arduino/.arduino-bricks/ei-models
      EI_KEYWORD_SPOTTING_MODEL: /models/ootb/ei/keyword-spotting-hey-arduino.eim
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:1337/api/info || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 25
    networks:
      - ventuno-net
    restart: unless-stopped

  # Interactive bring-up & calibration container (ignored by `docker compose up`)
  robot-tools:
    image: so101-ventuno-q-robot-controller:latest
    profiles: ["tools"]
    privileged: true
    group_add:
      - "29"  # audio
    env_file:
      - .env
    volumes:
      - /dev:/dev
      - ./config:/app/config
      - ./assets:/app/assets
      - ./data:/app/data
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tests:/app/tests
    networks:
      - ventuno-net
    stdin_open: true
    tty: true

networks:
  ventuno-net:
    driver: bridge
