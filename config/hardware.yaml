# Hardware, camera, calibration, and safety configuration for SO-101 + VENTUNO Q

arm:
  port: "${SO101_FOLLOWER_PORT:-/dev/so101_follower}"
  id: "${SO101_FOLLOWER_ID:-so101_follower_main}"
  baudrate: 1000000
  calibration_path: "config/arm_calibration.yaml"
  motor_ids:
    shoulder_pan: 1
    shoulder_lift: 2
    elbow_flex: 3
    wrist_flex: 4
    wrist_roll: 5
    gripper: 6
  control_hz: 30
  move_duration_s: 1.4
  # Folded rest pose in degrees (tucked back & left behind Marker 1 so camera view of cup is clear)
  home_pose_deg:
    shoulder_pan: -5.4
    shoulder_lift: -106.1
    elbow_flex: 181.9
    wrist_flex: -100.4
    wrist_roll: 0.4
    gripper: 19.9
  # Conservative joint software limits (degrees)
  joint_limits_deg:
    shoulder_pan: [-110.0, 110.0]
    shoulder_lift: [-95.0, 95.0]
    elbow_flex: [-100.0, 181.0]
    wrist_flex: [-100.0, 110.0]
    wrist_roll: [-150.0, 150.0]
    gripper: [0.0, 100.0]

kinematics:
  # Effective link lengths (meters) for the pure-NumPy SO-101 fallback solver
  # Calibrated against physical SO-101 hand-hover measurements
  base_height_m: 0.125
  shoulder_offset_x_m: 0.0375
  upper_arm_m: 0.116
  forearm_m: 0.135
  wrist_to_tip_m: 0.170
  upper_arm_dogleg_deg: 14.0  # Built-in SO-101 upper-arm forward offset (atan2(28mm, 112.6mm))
  workspace_radius_min_m: 0.12
  workspace_radius_max_m: 0.32
  min_z_m: -0.003
  # Verified via scripts/check_joints.py --check-signs
  joint_signs:
    shoulder_pan: -1.0
    shoulder_lift: 1.0
    elbow_flex: 1.0
    wrist_flex: 1.0
    wrist_roll: -1.0
    gripper: 1.0
  # Trim neutral pan offset (-9.1 deg shifts ~+0.75cm toward +y left from -6.8)
  joint_offsets_deg:
    shoulder_pan: -9.1

workspace:
  # Height targets in SO-101 base frame (meters, z=0 is tabletop mat surface)
  pre_grasp_offset_m: 0.065
  item_pick_z_m:
    sugar_cube: 0.012
    marshmallow: 0.000        # Dropped 1cm for TPU jaw pinch zone around mini marshmallow
    rigid_object: 0.012       # For testing with Legos, wooden blocks, etc.
  # Visual point height on the item for camera parallax (falls back to item_pick_z_m if omitted)
  item_point_z_m:
    marshmallow: 0.012
  cup_rim_z_m: 0.088
  transit_z_m: 0.110          # Clears 8.8cm cup rim by 2.2cm within wrist_flex <= 109.5 deg
  cup_drop_z_m: 0.102         # Drop 1.4cm above 8.8cm rim center

  # Item-specific gripper targets (0 = closed, 100 = fully open)
  gripper_profiles:
    open_pct: 75.0
    max_jaw_width_m: 0.1416    # Calibrated via scripts/check_joints.py --calibrate-gripper (gap at 100%)
    min_jaw_width_m: 0.0007    # Calibrated gap at 0% closed
    open_clearance_m: 0.018   # Snug extra clearance above estimated item width (when use_width_estimate=true)
    squeeze_margin_m: 0.006   # Default squeeze margin for compliant TPU jaws
    use_width_estimate: true  # Estimate width from Gemini pick_box/grasp_p1..p2 to adapt open_pct & close_pct
    enforce_max_width: true   # Refuse items wider than current open jaw gap instead of jamming
    # STS3215 hardware load/stall tactile grasp (test thresholds with check_joints.py --test-grip first)
    contact_detection:
      enabled: true
      item_types: ["rigid_object", "sugar_cube"] # Tactile stop for hard items; marshmallows use close_pct
      load_threshold: 350     # Hard cap (0..1000) above normal ~195 free-closing PWM load
      load_delta: 90          # Firm contact rise above baseline before clamping
      torque_limit: 650       # Closing torque limit (0..1000) for solid TPU grip
      squeeze_extra_pct: 7.0  # Press ~5-6mm deeper into compliant TPU after contact triggers
    sugar_cube:
      close_pct: 22.0
    marshmallow:
      close_pct: 0.0          # Fallback when width estimate disabled
      squeeze_margin_m: 0.016 # Mini marshmallows (~15mm) close to 0%; jumbo (~30mm) closes ~25%
    rigid_object:
      close_pct: 18.0         # Firm grasp for small rigid test objects (e.g. Lego)

  # Behavior when switched to toy mode (--toy-mode or "toy mode" command)
  default_mode: "cocoa"       # "cocoa" (kid-safe drink treats only) or "toy" (general mini-manipulator)
  toy_mode:
    open_pct: 90.0            # Open wider (~5cm) in toy mode for varied tabletop objects
    use_estimated_height: true
    use_wrist_roll: true      # Align wrist_roll to narrowest grasp axis
    wrist_zero_pinch_axis: "y" # Pinch axis when wrist_roll=0 ("y" lateral or "x" radial)
    wrist_roll_window_deg: [-40.0, 140.0] # 180-deg symmetric window avoiding servo ID 5 wrap (< -56 deg)
    bite_fraction: 0.75       # Aim tips 3/4 down from top (1/4 above mat) for items < 6cm tall
    tall_object_threshold_m: 0.060
    max_jaw_depth_m: 0.045    # Max jaw pocket depth for >= 6cm items so gripper palm clears top
    tip_grab_offset_m: 0.002  # Extra 2mm deep margin for compliant TPU pad flex
    max_pick_z_m: 0.035

cameras:
  overhead:
    device: "${CAM_OVERHEAD_DEVICE:-/dev/video0}"
    width: 1280
    height: 720
    fps: 30
    fourcc: "MJPG"
    warmup_frames: 5
  wrist:
    device: "${CAM_WRIST_DEVICE:-/dev/video2}"
    width: 640
    height: 480
    fps: 30
    fourcc: "MJPG"
    warmup_frames: 3

aruco:
  dictionary: "DICT_4X4_50"
  # Measured (x, y) in meters in SO-101 base frame (+x forward, +y left)
  # Measure your taped mat corners before running scripts/calibrate_mat.py
  corner_markers:
    1: [0.205,  0.108]   # Near-left
    2: [0.205, -0.108]   # Near-right
    3: [0.49,  0.108]   # Far-left
    4: [0.49, -0.108]   # Far-right
    
  camera_position_m: [0.0, 0.115, 0.45]   # Measured overhead camera [X, Y, Z] in meters (+x forward, +y left)

brain:
  model: "gemini-4-hydrogen"
  thinking_level: "low"
  max_retries: 1

voice:
  gemma_api_url: "${GEMMA_API_URL:-http://llamacpp-models-runner:9999/v1/chat/completions}"
  gemma_model: "${GEMMA_MODEL:-gemma-4-E2B_q4_0-it}"
  asr_api_url: "${ASR_API_URL:-http://audio-analytics-runner:8085/audio-analytics/v1/api}"
  asr_ws_url: "${ASR_WS_URL:-ws://audio-analytics-runner:8085/stream}"
  asr_model: "${ASR_MODEL:-whisper-small-quantized}"
  asr_language: "${ASR_LANGUAGE:-en}"
  asr_vad_ms: 700
  tts_api_url: "${TTS_API_URL:-http://kokoro-tts:9100/speak}"
  tts_voice: "${TTS_VOICE:-bm_george}"
  tts_speed: 1.0
  tts_lang: "${TTS_LANG:-en-gb}"
  capture_device: "${ALSA_CAPTURE_DEVICE:-plughw:CARD=Array,DEV=0}"
  playback_device: "${ALSA_PLAYBACK_DEVICE:-plughw:CARD=Device,DEV=0}"
  sample_rate: 16000
  channels: 1
  wake_word_enabled: false
  kws_api_url: "${KWS_API_URL:-http://ei-keyword-spot-runner:1337}"
  kws_label: "hey_arduino"
  kws_confidence: 0.80
  kws_window_s: 12.0
  mute_padding_s: 0.6
